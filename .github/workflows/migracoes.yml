# Aplicação controlada de migrations do Prisma em ambiente cloud (Neon) e,
# em Production, publicação do SHA validado de `main` na Vercel.
#
# Disparo MANUAL apenas (workflow_dispatch). Não roda em push nem em
# pull_request — portanto é inalcançável a partir de forks.
#
# A proteção real está no GitHub Environment selecionado:
#   - o secret DATABASE_URL_DIRECT só existe dentro do Environment;
#   - o Environment `production` deve ter "Required reviewers" configurado,
#     de modo que a execução fique pendente de aprovação humana.
#
# Usa a URL DIRECT/UNPOOLED do Neon: o pooler em modo transaction quebra os
# advisory locks do Prisma Migrate. O schema.prisma não é alterado — o valor é
# injetado como DATABASE_URL apenas nestes passos.
#
# Ordem de release em Production (fecha a janela "código novo x schema antigo"):
#   1. o operador informa o SHA exato de `main` a promover (nunca o HEAD do
#      momento da aprovação);
#   2. o SHA é validado: existe, é alcançável a partir de `main`, passou no
#      check obrigatório da CI e continua sendo o HEAD de `main`;
#   3. migrate status -> migrate deploy -> migrate status (gate);
#   4. só então a Vercel cria um deployment de Production a partir desse SHA;
#   5. o workflow aguarda READY e promove o mesmo artefato para os domínios.
#   A Production Branch da Vercel é `main`, mas a autoatribuição de domínios
#   fica desativada. Nada chega aos aliases de Production antes do gate.
#
# Migrations continuam precisando ser compatíveis com deploy progressivo
# (expand -> código compatível -> contract depois): entre os passos 3 e 4 a
# versão anterior do código roda contra o schema novo.
#
# Regras duras: nunca `prisma migrate dev`, `prisma db push`,
# `prisma migrate reset` ou `pnpm run seed` contra Production.
name: Migrations (Neon)

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente alvo das migrations
        required: true
        type: choice
        options:
          - preview
          - production
      confirmacao:
        description: Digite APLICAR para confirmar
        required: true
        type: string
      sha:
        description: >-
          SHA completo (40 hex) do HEAD de `main` a publicar após as migrations.
          Obrigatório em production; ignorado em preview.
        required: false
        type: string
        default: ""

concurrency:
  group: migracoes-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  migrar:
    name: migrate deploy — ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      TARGET_SHA: ${{ inputs.sha }}
      CHECK_OBRIGATORIO: Lint, typecheck, testes e build
      VERCEL_PROJECT_ID: prj_R05rQMQmFPVzZmBXnQDCvoUK9jQ2
      VERCEL_TEAM_ID: team_ICY1aaLTQI5BmxlyrSjpRTJC

    steps:
      - name: Conferir confirmação explícita
        if: inputs.confirmacao != 'APLICAR'
        run: |
          echo "Confirmação inválida. Digite exatamente APLICAR para executar." >&2
          exit 1

      - name: Exigir SHA completo em production
        if: inputs.ambiente == 'production'
        run: |
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Em production o input 'sha' é obrigatório e deve ser o SHA completo (40 hex) de main." >&2
            exit 1
          fi

      # Em production o checkout é feito no SHA informado, nunca no HEAD atual
      # de main: se main avançar enquanto a aprovação demora, o SHA promovido
      # continua sendo o que foi validado.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ambiente == 'production' && inputs.sha || github.ref }}
          fetch-depth: 0

      - name: Validar SHA alvo (HEAD de main e CI verde)
        if: inputs.ambiente == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          if [ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]; then
            echo "Checkout não está no SHA alvo." >&2; exit 1
          fi
          git cat-file -e "${TARGET_SHA}^{commit}"

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "SHA $TARGET_SHA não é alcançável a partir de origin/main." >&2; exit 1
          fi

          if [ "$(git rev-parse origin/main)" != "$TARGET_SHA" ]; then
            echo "SHA $TARGET_SHA não é mais o HEAD de main ($(git rev-parse origin/main))." >&2; exit 1
          fi

          conclusao=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
            --jq "[.check_runs[] | select(.name == \"${CHECK_OBRIGATORIO}\")] | sort_by(.completed_at) | last | .conclusion // \"ausente\"")
          if [ "$conclusao" != "success" ]; then
            echo "Check obrigatório '${CHECK_OBRIGATORIO}' não está verde para ${TARGET_SHA} (estado: ${conclusao})." >&2; exit 1
          fi

          echo "SHA ${TARGET_SHA} validado: HEAD de main e CI verde."

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir se o secret do ambiente está presente
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_DIRECT não configurado no Environment '${{ inputs.ambiente }}'." >&2
            exit 1
          fi

      # A linha `Datasource "db": ... at "<host>"` impressa aqui é a EVIDÊNCIA
      # do banco alvo e deve ser copiada para o relatório de homologação.
      # `migrate status` sai com código != 0 quando há migrations pendentes,
      # que é exatamente o estado esperado ANTES do deploy. Por isso o `|| true`
      # aqui — o passo é de evidência, não de gate. O status final abaixo é o gate.
      - name: Status antes
        run: pnpm exec prisma migrate status || true

      - name: Aplicar migrations
        run: pnpm exec prisma migrate deploy

      - name: Status depois
        run: pnpm exec prisma migrate status

      # Só executa se todos os passos anteriores passaram (schema confirmado).
      # A autoatribuição de domínios deve permanecer desativada no projeto. O
      # workflow cria um build novo com env de Production e promove exatamente
      # esse artefato depois de READY.
      - name: Publicar e promover SHA validado na Vercel
        if: inputs.ambiente == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN não configurado no Environment 'production'." >&2; exit 1
          fi

          api="https://api.vercel.com"
          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          projeto=$(curl --fail-with-body --silent --show-error \
            -H "$auth" \
            "${api}/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")

          branch=$(jq -r '.link.productionBranch // ""' <<<"$projeto")
          auto_alias=$(jq -r '.autoAssignCustomDomains' <<<"$projeto")
          if [ "$branch" != "main" ] || [ "$auto_alias" != "false" ]; then
            echo "Configuração insegura na Vercel: branch=${branch}, autoAssignCustomDomains=${auto_alias}." >&2
            exit 1
          fi

          payload=$(jq -nc --arg sha "$TARGET_SHA" '{
            name: "upa-do-tenis",
            gitSource: {
              type: "github",
              repoId: 1287580683,
              ref: "main",
              sha: $sha
            },
            target: "production"
          }')
          criado=$(curl --fail-with-body --silent --show-error \
            -X POST -H "$auth" -H "Content-Type: application/json" \
            --data "$payload" \
            "${api}/v13/deployments?teamId=${VERCEL_TEAM_ID}&forceNew=1")
          deployment_id=$(jq -r '.id // empty' <<<"$criado")
          deployment_url=$(jq -r '.url // empty' <<<"$criado")
          if [ -z "$deployment_id" ] || [ -z "$deployment_url" ]; then
            echo "A Vercel não retornou o deployment criado." >&2; exit 1
          fi

          estado=""
          for tentativa in $(seq 1 60); do
            consulta=$(curl --fail-with-body --silent --show-error \
              -H "$auth" \
              "${api}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=20")
            estado=$(jq -r --arg id "$deployment_id" \
              '.deployments[] | select(.uid == $id) | .readyState' <<<"$consulta")
            case "$estado" in
              READY) break ;;
              ERROR|CANCELED) echo "Deployment ${deployment_id} terminou em ${estado}." >&2; exit 1 ;;
            esac
            sleep 5
          done
          if [ "$estado" != "READY" ]; then
            echo "Timeout aguardando READY para ${deployment_id}." >&2; exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST -H "$auth" -H "Content-Type: application/json" --data '{}' \
            "${api}/v10/projects/${VERCEL_PROJECT_ID}/promote/${deployment_id}?teamId=${VERCEL_TEAM_ID}" >/dev/null

          alvo_sha=""
          alvo_ref=""
          subestado=""
          # O projeto usa rolling release de 10% por 5 minutos antes de 100%.
          # A janela de 10 minutos cobre a progressão e a atualização do alvo.
          for tentativa in $(seq 1 120); do
            nonce=$(date +%s%N)
            projeto_atual=$(curl --fail-with-body --silent --show-error \
              -H "$auth" -H "Cache-Control: no-cache" \
              "${api}/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}&nonce=${nonce}")
            alvo_sha=$(jq -r '.targets.production.meta.githubCommitSha // ""' <<<"$projeto_atual")
            alvo_ref=$(jq -r '.targets.production.meta.githubCommitRef // ""' <<<"$projeto_atual")
            subestado=$(jq -r '.targets.production.readySubstate // ""' <<<"$projeto_atual")
            if [ "$alvo_sha" = "$TARGET_SHA" ] && [ "$alvo_ref" = "main" ] && [ "$subestado" = "PROMOTED" ]; then
              break
            fi
            sleep 5
          done
          if [ "$alvo_sha" != "$TARGET_SHA" ] || [ "$alvo_ref" != "main" ] || [ "$subestado" != "PROMOTED" ]; then
            echo "Deployment READY, mas main@${TARGET_SHA} não foi confirmado como produção promovida." >&2; exit 1
          fi

          echo "Deployment ${deployment_id} promovido a partir de main@${TARGET_SHA}."
          echo "URL imutável: https://${deployment_url}"
